<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLA AI Platform - Continuous Calibrated Dictation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: linear-gradient(135deg, #090d16 0%, #111827 100%); 
            color: #f1f5f9; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            min-height: 100vh;
        }
        .glass { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
        }
        .card-glow { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .logo-box { font-size: 22px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; }
        
        .unified-control-axis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            align-items: end;
        }
        
        .axis-item { display: flex; flex-direction: column; width: 100%; }
        
        .control-btn { 
            height: 50px; 
            color: white; 
            border: none; 
            padding: 0 16px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .btn-upload { background: #0ea5e9; } .btn-upload:hover { background: #0284c7; }
        .btn-transcribe { background: #6366f1; } .btn-transcribe:hover { background: #4f46e5; }
        .btn-pause { background: #f59e0b; } .btn-pause:hover { background: #d97706; }
        .btn-mom { background: #10b981; } .btn-mom:hover { background: #059669; }
        
        .control-btn:disabled { background: #1e293b !important; color: #64748b !important; cursor: not-allowed; opacity: 0.4; transform: none !important; border: 1px solid rgba(255, 255, 255, 0.03) !important; }
        .control-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
        
        .dropdown-custom, .translate-select { 
            background-color: #111827 !important; 
            color: #f8fafc !important; 
            border: 1px solid rgba(255, 255, 255, 0.12) !important; 
            height: 50px !important; 
            border-radius: 8px !important;
            font-size: 14px !important;
        }
        .dropdown-custom:focus, .translate-select:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        
        .file-status-box {
            background: #0b0f19;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: #94a3b8;
        }
        
        .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .text-panel { background-color: #0b0f19 !important; color: #f1f5f9 !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; height: 260px; resize: none; border-radius: 8px; font-size: 14px; line-height: 1.6; }
        .text-panel:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }
        
        .go-btn { background: #10b981; color: white; border: none; height: 50px; border-radius: 8px; font-weight: 600; width: 100%; transition: all 0.2s; }
        .go-btn:hover:not(:disabled) { background: #059669; }
        .go-btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
        .status-msg { color: #38bdf8; font-weight: 500; font-size: 14px; }
    </style>
</head>

<body>

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="logo-box"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>MLA AI Engine</div>
        <div id="headerActions" class="d-flex align-items-center">
            <span class="badge bg-dark border border-secondary text-success px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Multilingual Engine Connected</span>
        </div>
    </div>

    <div class="status-bar mb-3">
        <div id="appStatus" class="status-msg"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Synchronizing backend database configurations...</div>
    </div>

    <div class="glass card-glow p-4 mb-4">
        <div class="unified-control-axis">
            <div class="axis-item">
                <label class="small text-muted mb-1">Meeting Scope</label>
                <select class="form-select dropdown-custom" id="participantSelect"><option value="">Group</option></select>
            </div>
            
            <div class="axis-item">
                <label class="small text-muted mb-1">Live Dictation Profile</label>
                <select class="form-select dropdown-custom" id="micLanguageSelect">
                    <option value="en-IN" selected>English (India / en-IN)</option>
                    <option value="en-US">English (United States / en-US)</option>
                    <option value="hi-IN">Hindi (hi-IN)</option>
                    <option value="ta-IN">Tamil (ta-IN)</option>
                    <option value="te-IN">Telugu (te-IN)</option>
                </select>
            </div>
            
            <div class="axis-item">
                <label class="small text-muted mb-1">File Ingestion</label>
                <button class="control-btn btn-upload" id="btnUploadTrigger"><i class="fa-solid fa-cloud-arrow-up"></i>Upload File</button>
                <input type="file" id="actualFileInput" class="form-control d-none" accept=".mp3,.mp4,.wav">
            </div>

            <div class="axis-item">
                <label class="small text-muted mb-1">Loaded File Target</label>
                <div id="fileSelectedName" class="file-status-box text-truncate">No asset loaded</div>
            </div>

            <div class="axis-item">
                <button class="control-btn btn-transcribe" id="btnTranscribe"><i class="fa-solid fa-play"></i>Start Track</button>
            </div>

            <div class="axis-item">
                <button class="control-btn btn-pause" id="btnPause" disabled><i class="fa-solid fa-pause"></i>Pause</button>
            </div>

            <div class="axis-item">
                <button class="control-btn btn-mom" id="btnMom"><i class="fa-solid fa-file-signature"></i>Generate MOM</button>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-6">
            <div class="glass card-glow p-3">
                <div class="panel-title"><i class="fa-solid fa-waveform-lines"></i>Active Multi-Language Transcript Terminal</div>
                <textarea class="form-control text-panel" id="txtTranscript" placeholder="Live streaming or static asset transcription logs will stream here..."></textarea>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="glass card-glow p-3">
                <div class="panel-title"><i class="fa-solid fa-file-invoice"></i>AI Generated Minutes of Meeting (English Translation)</div>
                <textarea class="form-control text-panel" id="txtAiOutput" placeholder="MOM English conversion output appears here..." readonly></textarea>
            </div>
        </div>
    </div>

    <div class="glass card-glow p-4">
        <h5 class="mb-3 text-info"><i class="fa-solid fa-globe me-2"></i>Multi-Language Translation Engine Matrix</h5>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="small text-muted mb-1">Identified Source Accent</label>
                <select class="form-select translate-select" id="translateFromSelect" disabled><option value="">Auto Detected</option></select>
            </div>
            <div class="col-md-4">
                <label class="small text-muted mb-1">Target Language Node</label>
                <select class="form-select translate-select" id="translateToSelect"><option value="">Select Target Language</option></select>
            </div>
            <div class="col-md-4">
                <button class="go-btn" id="btnGo" disabled><i class="fa-solid fa-bolt me-2"></i>Execute Translation</button>
            </div>
        </div>
        <textarea class="form-control text-panel w-100 mt-3" id="txtTranslation" style="height: 120px;" placeholder="Translation results lookups stream here..." readonly></textarea>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    let currentRequestId = null;
    let isRecordingLive = false;
    let isPaused = false;
    let explicitStopActive = false;
    
    // Storage segments tracking language transcription chunks correctly
    let globalFinalTranscript = ""; 

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
        recognition.continuous = true;
        recognition.interimResults = true;
    }

    const fileInput = document.getElementById('actualFileInput');
    const uploadBtnTrigger = document.getElementById('btnUploadTrigger');
    const fileSelectedName = document.getElementById('fileSelectedName');
    const transcribeBtn = document.getElementById('btnTranscribe');
    const pauseBtn = document.getElementById('btnPause');
    const participantSelect = document.getElementById('participantSelect');
    const micLanguageSelect = document.getElementById('micLanguageSelect');
    const momBtn = document.getElementById('btnMom');
    const translateFromSelect = document.getElementById('translateFromSelect');
    const translateToSelect = document.getElementById('translateToSelect');
    const goBtn = document.getElementById('btnGo');
    const appStatus = document.getElementById('appStatus');
    const txtTranscript = document.getElementById('txtTranscript');
    const txtAiOutput = document.getElementById('txtAiOutput');
    const txtTranslation = document.getElementById('txtTranslation');

    const historyBtn = document.createElement('button');
    historyBtn.className = "btn btn-sm btn-outline-secondary ms-3 text-light";
    historyBtn.innerHTML = '<i class="fa-solid fa-clock-rotate-left me-1"></i> Records';
    document.getElementById('headerActions').appendChild(historyBtn);

    transcribeBtn.disabled = true; momBtn.disabled = true;

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch(`${API_URL}/api/dropdowns`);
            const data = await res.json();
            participantSelect.innerHTML = '<option value="">Select Group</option>';
            data.participants.forEach(p => { participantSelect.innerHTML += `<option value="${p}">${p}</option>`; });
            translateFromSelect.innerHTML = '<option value="">Auto Detected</option>';
            translateToSelect.innerHTML = '<option value="">Select Target Language</option>';
            data.languages.forEach(l => {
                translateFromSelect.innerHTML += `<option value="${l}">${l}</option>`;
                translateToSelect.innerHTML += `<option value="${l}">${l}</option>`;
            });
            appStatus.innerHTML = '<span class="text-success"><i class="fa-solid fa-circle-check"></i> System configuration matrices synchronized perfectly.</span>';
        } catch (err) {
            appStatus.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Backend server communication down. Ensure main.py runs on port 8000.</span>`;
        }
    });

    uploadBtnTrigger.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        fileSelectedName.textContent = fileInput.files.length > 0 ? fileInput.files[0].name : "No asset loaded";
        evaluateStateLocks();
    });

    function evaluateStateLocks() {
        if (participantSelect.value !== "") {
            transcribeBtn.disabled = false;
            if (fileInput.files.length === 0) {
                transcribeBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> Start Live Mic';
                transcribeBtn.style.backgroundColor = "#8b5cf6";
            } else {
                transcribeBtn.innerHTML = '<i class="fa-solid fa-play"></i> Run Transcribe';
                transcribeBtn.style.backgroundColor = "#2563eb";
            }
        } else {
            transcribeBtn.disabled = true;
            pauseBtn.disabled = true;
        }
    }
    participantSelect.addEventListener('change', evaluateStateLocks);

    function provisionStreamingEngine() {
        if (!recognition) return;

        // Force language profile node configuration explicitly
        const activeLang = micLanguageSelect.value;
        recognition.lang = activeLang; 

        recognition.onstart = () => {
            isRecordingLive = true;
            transcribeBtn.innerHTML = '<i class="fa-solid fa-circle-stop"></i> Stop & Save';
            transcribeBtn.style.backgroundColor = "#dc2626";
            pauseBtn.disabled = false;
            appStatus.innerHTML = `<span class="text-success"><i class="fa-solid fa-microphone fa-pulse"></i> Engine tracking locked in [${recognition.lang}]... Speak now.</span>`;
        };

        recognition.onresult = (event) => {
            if (isPaused) return; 
            
            let interimBuffer = "";
            let newlyFinalizedText = "";
            
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const resultChunk = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    newlyFinalizedText += resultChunk + " ";
                } else {
                    interimBuffer += resultChunk;
                }
            }
            
            if (newlyFinalizedText) {
                globalFinalTranscript += newlyFinalizedText;
            }
            
            // Build string seamlessly across multi-lingual structures
            let totalCombinedText = globalFinalTranscript + interimBuffer;
            
            txtTranscript.value = totalCombinedText.trim();
            txtTranscript.scrollTop = txtTranscript.scrollHeight; 
        };

        recognition.onerror = (err) => {
            console.error("Audio Interface Stream warning:", err.error);
            if (err.error === 'not-allowed') {
                appStatus.innerHTML = `<span class="text-danger"><i class="fa-solid fa-hand"></i> Mic Blocked! Provide permission inside address bar origin configs.</span>`;
                explicitStopActive = true;
                recognition.stop();
            }
        };

        recognition.onend = () => {
            // Keep speech instance alive during gaps without erasing non-English states
            if (!explicitStopActive && !isPaused) {
                setTimeout(() => {
                    if (!explicitStopActive && !isPaused) {
                        try {
                            recognition.lang = micLanguageSelect.value;
                            recognition.start();
                        } catch (e) {}
                    }
                }, 100);
            } else if (explicitStopActive) {
                finalizeSessionCapture();
            }
        };
    }

    async function finalizeSessionCapture() {
        isRecordingLive = false;
        pauseBtn.disabled = true;
        transcribeBtn.disabled = true;
        transcribeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving Session Logs...';
        
        const finalPayloadText = txtTranscript.value.trim();
        if (finalPayloadText) {
            await sendStreamPayloadToBackend(finalPayloadText);
        } else {
            appStatus.innerHTML = `<span class="text-warning"><i class="fa-solid fa-circle-exclamation"></i> Save aborted: Empty text buffer.</span>`;
            evaluateStateLocks();
        }
    }

    transcribeBtn.addEventListener('click', async () => {
        if (fileInput.files.length === 0) {
            if (!isRecordingLive) {
                explicitStopActive = false;
                isPaused = false;
                globalFinalTranscript = "";
                txtTranscript.value = "";
                pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                pauseBtn.className = "control-btn btn-pause";
                
                provisionStreamingEngine();
                try { recognition.start(); } catch(e){}
            } else {
                explicitStopActive = true;
                isPaused = false;
                try { recognition.stop(); } catch(e){}
            }
        } else {
            transcribeBtn.disabled = true;
            transcribeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Audio File...';
            await runAsynchronousFilePipeline(fileInput.files[0], "FILE");
        }
    });

    pauseBtn.addEventListener('click', () => {
        if (!isRecordingLive) return;
        
        if (!isPaused) {
            isPaused = true;
            pauseBtn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
            pauseBtn.className = "control-btn btn-success";
            appStatus.innerHTML = '<span class="text-info"><i class="fa-solid fa-pause"></i> Tracking Paused. Recording suspended manually.</span>';
            try { recognition.stop(); } catch(e){}
        } else {
            isPaused = false;
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
            pauseBtn.className = "control-btn btn-pause";
            appStatus.innerHTML = '<span class="text-success"><i class="fa-solid fa-microphone fa-pulse"></i> Resuming loop tracking matrix...</span>';
            
            recognition.lang = micLanguageSelect.value;
            try { recognition.start(); } catch(e){}
        }
    });

    async function sendStreamPayloadToBackend(textData) {
        const formData = new FormData();
        formData.append("text_content", textData);
        formData.append("participant_group", participantSelect.value);
        try {
            const res = await fetch(`${API_URL}/api/transcribe-stream`, { method: 'POST', body: formData });
            if (res.status === 404) { throw new Error("404"); }
            const data = await res.json();
            currentRequestId = data.request_id;
            translateFromSelect.value = "ENGLISH";
            momBtn.disabled = false; goBtn.disabled = false;
            appStatus.innerHTML = `<span class="text-success"><i class="fa-solid fa-circle-check"></i> Live Multi-language Text Ingested. ID: ${currentRequestId}</span>`;
        } catch (err) {
            if(err.message === "404") {
                appStatus.innerHTML = '<span class="text-danger"><i class="fa-solid fa-circle-xmark"></i> Endpoint 404 Error: Missing /api/transcribe-stream in main.py.</span>';
            } else {
                appStatus.innerHTML = '<span class="text-danger"><i class="fa-solid fa-circle-xmark"></i> Ingestion workflow error. Verify backend application visibility.</span>';
            }
        } evaluateStateLocks();
    }

    async function runAsynchronousFilePipeline(fileObj, sType) {
        const formData = new FormData();
        formData.append("file", fileObj);
        formData.append("participant_group", participantSelect.value);
        formData.append("source_type", sType);
        try {
            const res = await fetch(`${API_URL}/api/transcribe`, { method: 'POST', body: formData });
            if (res.status === 404) { throw new Error("404"); }
            const data = await res.json();
            currentRequestId = data.request_id;
            txtTranscript.value = data.transcription;
            translateFromSelect.value = data.detected_language;
            momBtn.disabled = false; goBtn.disabled = false;
            appStatus.innerHTML = `<span class="text-success"><i class="fa-solid fa-circle-check"></i> Asset parsing complete. ID Reference: ${currentRequestId}</span>`;
        } catch (err) {
            if(err.message === "404") {
                appStatus.innerHTML = '<span class="text-danger"><i class="fa-solid fa-bug"></i> Endpoint 404 Error: Missing /api/transcribe route in main.py backend.</span>';
            } else {
                appStatus.innerHTML = '<span class="text-danger"><i class="fa-solid fa-bug"></i> Whisper parsing core module connection exception.</span>';
            }
        } evaluateStateLocks();
    }

    momBtn.addEventListener('click', async () => {
        try {
            momBtn.disabled = true;
            momBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Structuring...';
            const res = await fetch(`${API_URL}/api/generate-mom/${currentRequestId}`, { method: 'POST' });
            const data = await res.json();
            txtAiOutput.value = data.mom;
            appStatus.innerHTML = '<span class="text-success"><i class="fa-solid fa-circle-check"></i> MOM generated in standard English successfully.</span>';
        } catch(e){} finally {
            momBtn.disabled = false;
            momBtn.innerHTML = '<i class="fa-solid fa-file-signature"></i> Generate MOM';
        }
    });

    goBtn.addEventListener('click', async () => {
        const formData = new FormData();
        formData.append("translate_to", translateToSelect.value);
        try {
            const res = await fetch(`${API_URL}/api/translate/${currentRequestId}`, { method: 'POST', body: formData });
            const data = await res.json();
            txtTranslation.value = data.translation;
        } catch(e){}
    });

    historyBtn.addEventListener('click', async () => {
        try {
            const res = await fetch(`${API_URL}/api/history`);
            const items = await res.json();
            let list = items.map(h => `ID: [${h.request_id}] | ${h.file_name}`).join("\n");
            let id = prompt(`Select Target Historical Document Reference Key:\n\n${list}\n\nEnter ID:`);
            if (id) {
                const detailRes = await fetch(`${API_URL}/api/history/${id}`);
                const detail = await detailRes.json();
                txtTranscript.value = detail.transcription;
                txtAiOutput.value = detail.mom;
                txtTranslation.value = detail.translation;
                currentRequestId = id;
                momBtn.disabled = false; goBtn.disabled = false;
            }
        } catch(e){}
    });
</script>
</body>
</html>
